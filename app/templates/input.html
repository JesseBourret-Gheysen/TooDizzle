<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TooDizzle</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#253356">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #253356;
      --bg-deep:     #1a2540;
      --surface:     #f5f8ff;
      --border:      #ccd4e8;
      --text-light:  #e0eaf8;
      --text-dark:   #1a2540;
      --muted-light: rgba(224, 234, 248, 0.6);
      --muted-dark:  #6a7a9a;
      --btn:         #2d63aa;
      --btn-h:       #1e4e8a;
      --focus-ring:  rgba(45, 99, 170, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(45, 99, 170, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 90% 90%, rgba(26, 37, 64, 0.6) 0%, transparent 60%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 2.5rem 1.25rem 5rem;
    }

    .wrap { max-width: 600px; margin: 0 auto; }

    /* ── Nav ─────────────────────────────────────────────────────────── */
    nav { display: flex; gap: 0.375rem; margin-bottom: 2.5rem; }
    .nav-btn {
      display: inline-block;
      padding: 0.38rem 1.05rem;
      border-radius: 999px;
      font-size: 0.775rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.04em;
      border: 1.5px solid rgba(224, 234, 248, 0.2);
      color: var(--muted-light);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-light);
      border-color: rgba(224, 234, 248, 0.35);
    }
    .nav-btn.active {
      background: rgba(255,255,255,0.15);
      border-color: rgba(224, 234, 248, 0.55);
      color: var(--text-light);
      font-weight: 600;
    }
    .scan-btn {
      cursor: pointer; font-family: inherit; margin-left: auto;
      background: var(--btn); color: #fff; border-color: var(--btn); font-weight: 600;
    }
    .scan-btn:hover { background: var(--btn-h); color: #fff; border-color: var(--btn-h); }
    .scan-btn:disabled { opacity: 0.55; cursor: default; }

    /* ── Header ──────────────────────────────────────────────────────── */
    header { margin-bottom: 2rem; }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-light);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    header p {
      color: var(--muted-light);
      font-size: 0.875rem;
      margin-top: 0.45rem;
    }

    /* ── Card ────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.85rem;
      box-shadow:
        0 8px 32px rgba(0,0,0,0.22),
        0 2px 8px rgba(0,0,0,0.1),
        0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .card h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 1.35rem;
      letter-spacing: -0.01em;
    }

    /* ── Form ────────────────────────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1rem; }
    label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted-dark);
    }
    textarea, select {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      color: var(--text-dark);
      padding: 0.65rem 0.8rem;
      font-size: 0.875rem;
      font-family: 'DM Sans', system-ui, sans-serif;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    textarea {
      resize: vertical;
      min-height: 104px;
      line-height: 1.6;
    }
    textarea:focus, select:focus {
      border-color: var(--btn);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    select option { background: white; color: var(--text-dark); }

    .field-hint {
      font-size: 0.72rem;
      color: var(--muted-dark);
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .actions { display: flex; justify-content: flex-end; margin-top: 1.35rem; }
    button {
      background: var(--btn);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 0.675rem 1.85rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'DM Sans', system-ui, sans-serif;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    button:hover {
      background: var(--btn-h);
      box-shadow: 0 2px 10px rgba(45, 99, 170, 0.38);
    }

    /* [hidden] fix so display:none on subtype-field isn't overridden */
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      header h1 { font-size: 1.7rem; }
      .card { padding: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="/" class="nav-btn active">Add Task</a>
    <a href="/tasks" class="nav-btn">View Tasks</a>
    <button id="scan-btn" class="nav-btn scan-btn" type="button" title="Fetch &amp; OCR Instagram posts, then fold the text into each task">⟳ Enrich Tasks</button>
  </nav>

  <header>
    <h1>TooDizzle</h1>
    <p>Add something to work on.</p>
  </header>

  <div class="card">
    <h2>New Task</h2>
    <form method="POST" action="/submit">
      <div class="field">
        <label for="text">Task *</label>
        <textarea id="text" name="text" placeholder="Describe the task — paste a link, write a note…" required></textarea>
        <p class="field-hint">Supports **bold**, - bullets, and URLs on their own line.</p>
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="Tech">Tech</option>
          <option value="Bio/Health">Bio/Health</option>
          <option value="Exercise">Exercise</option>
          <option value="Music">Music</option>
          <option value="Art">Art</option>
          <option value="Events">Events</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field" id="subtype-field" style="display:none">
        <label for="subtype">Subtype</label>
        <select id="subtype" name="subtype">
          <option value="Other">Other</option>
          <option value="AI">AI</option>
          <option value="Hardware">Hardware</option>
          <option value="Creative">Creative</option>
        </select>
      </div>
      <div class="actions">
        <button type="submit">Add Task</button>
      </div>
    </form>
  </div>

</div>
<script>
  const typeSelect    = document.getElementById('type');
  const subtypeField  = document.getElementById('subtype-field');
  const subtypeSelect = document.getElementById('subtype');

  // Types that carry a subtype dropdown, with their option lists.
  const SUBTYPES = {
    Tech: ['Other', 'AI', 'Hardware', 'Creative'],
    Art:  ['movie/tv', 'music', 'digital', 'craft', 'other'],
  };

  function updateSubtype() {
    const opts = SUBTYPES[typeSelect.value];
    if (opts) {
      subtypeSelect.innerHTML = opts
        .map(o => `<option value="${o}">${o}</option>`).join('');
      subtypeField.style.display = '';
    } else {
      subtypeField.style.display = 'none';
      subtypeSelect.innerHTML = '';
    }
  }

  typeSelect.addEventListener('change', updateSubtype);
  updateSubtype();

  // Enrich Instagram links, then jump to the task list to watch progress.
  const scanBtn = document.getElementById('scan-btn');
  if (scanBtn) {
    scanBtn.addEventListener('click', async () => {
      scanBtn.disabled = true;
      scanBtn.textContent = '⟳ Enriching…';
      try { await fetch('/scan', { method: 'POST' }); } catch {}
      window.location.href = '/tasks';
    });
  }
</script>
</body>
</html>
